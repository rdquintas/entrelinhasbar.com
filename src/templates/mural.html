<!DOCTYPE html>
<html class="wolf-core-no-touch no-touch" data-scroll-orientation="vertical" lang="en-US">

<head>
	{{> head}}
	<link href="/css/mural.css" rel="stylesheet" />
</head>

<body
	class="wp-singular page-template-default page page-id-5 wp-theme-poize theme-poize woocommerce-js wolf poize not-edge page-title-about-us loading-animation-type-none site-layout-wide button-style-square global-skin-light skin-light wolf-core-yes menu-layout-top-justify-left menu-style-absolute menu-skin-light menu-width-wide mega-menu-width-fullwidth menu-hover-style- menu-sticky-hard submenu-bg-light accent-color-dark accent-color-is-black menu-items-visibility- side-panel-position-right side-panel-bg-light no-hero hero-font-light body-font-neue-haas-grotesk-text heading-font-neue-haas-grotesk-display menu-font-neue-haas-grotesk-text submenu-font-default transition-animation-type- has-text-logo logo-visibility-always is-page has-wvc hero-layout-none post-is-title-text post-is-hero footer-type-hidden footer-skin-dark footer-widgets-layout-none footer-layout-boxed bottom-bar-layout-centered bottom-bar-visible has-404-plugin desktop wolf-core wolf-core-body wolf-core-layout wolf-core-elementor wolf-core-elementor-page wolf-core-2-1-28 wolf-core-is-desktop wolf-core-not-edge wolf-core-not-firefox wolf-events wolf-popup-time-delayed-mobile-disabled wolf-popup-exit-intent-mobile-disabled elementor-default elementor-kit-38 elementor-page elementor-page-5 not-mobile no-secondary rs-safari"
	data-elementor-device-mode="desktop" data-hero-font-tone="light" data-post-id="5">
	{{> header}}
	<div class="content-inner section wvc-row wolf-core-row">
		<div class="content-wrapper">
			<div class="content-area" id="primary">
				<main class="clearfix" id="content">
					<div class="page-entry-content clearfix">
						<div class="elementor elementor-5" data-elementor-id="5" data-elementor-type="wp-page">
							<div class="locoscroll-bg-animated wolf-core-elementor-row wolf-core-font-light elementor-element elementor-element-9b4a77b locoscroll-bg-zoomin e-flex e-con-boxed e-con e-parent e-lazyloaded locoscroll-bg-loaded locoscroll-animate section-appeared-once section-appeared"
								data-bg-url="" data-bg-url-mobile="" data-bg-url-tablet=""
								data-color-tone="dark" data-e-type="container" data-element_type="container"
								data-font-skin="light" data-id="9b4a77b" data-scroll=""
								data-scroll-class="locoscroll-animate" data-scroll-css-progress=" "
								data-scroll-custom-duration="" data-scroll-custom-offset=""
								data-scroll-entrance-animation="" data-settings='{"background_background":"classic"}'>
								<div class="locoscroll-bg">{{hero hero.img_horizontal hero.img_vertical class=mural-hero}}</div>
								<div class="e-con-inner">
									<div class="wolf-core-elementor-row wolf-core-font- elementor-element elementor-element-14fcbc8 e-con-full e-flex e-con e-child e-lazyloaded"
										data-color-tone="" data-e-type="container" data-element_type="container"
										data-font-skin="" data-id="14fcbc8" data-scroll-class="locoscroll-animate"
										data-scroll-css-progress="" data-scroll-custom-duration=""
										data-scroll-custom-offset="" data-scroll-entrance-animation="">
										<div class="elementor-element elementor-element-4a8c9d4 poize-big-text-yes elementor-widget elementor-widget-heading"
											data-e-type="widget" data-element_type="widget" data-id="4a8c9d4"
											data-widget_type="heading.default">
											<div class="elementor-widget-container">
												<h1 class="elementor-heading-title elementor-size-default">
													{{#lang pt}}Boa onda{{/lang}}{{#lang en}}Good vibes{{/lang}}
												</h1>
											</div>
										</div>
									</div>
								</div>
							</div>
							<!-- Borda de tinta por baixo do hero (igual ao index) -->
							<div class="mural-hero-border" aria-hidden="true">
								<img alt="" decoding="async" height="142" src="/images/p_paint-border-light.png" width="1920" />
							</div>
							<section class="mural" data-mural data-batch="12" data-label-ampliar="{{ui.ampliar}}"
								data-label-reproduzir="{{ui.reproduzir}}" data-label-video="{{ui.video_titulo}}">
								<div class="mural__grid" data-mural-grid></div>
								<div class="mural__sentinel" data-mural-sentinel></div>
								<noscript>
									<ul class="mural__noscript">
										{{#each mural_noscript}}
										<li>{{{html}}}</li>
										{{/each}}
									</ul>
								</noscript>
							</section>
							<script type="application/json" id="mural-data">{{{mural_json}}}</script>
							<dialog class="mural-lightbox" data-lightbox aria-label="{{ui.ampliar}}">
								<button type="button" class="mural-lightbox__fechar" data-lightbox-close
									aria-label="{{ui.fechar}}">×</button>
								<div class="mural-lightbox__conteudo" data-lightbox-content></div>
							</dialog>
						</div>
					</div>
					<footer class="entry-meta page-entry-meta">
					</footer>
				</main>
			</div>
		</div>
	</div>
	{{> footer}}
	<svg class="e-font-icon-svg-symbols" style="display: none;"></svg>

	<script src="/js/config/config-aboutus.js"></script>
	<script src="/js/vendor/wp-hooks.js"></script>
	<script src="/js/vendor/wp-i18n.js"></script>
	<script src="/js/vendor/inview.js"></script>
	<script src="/js/vendor/countdown.js"></script>
	<script src="/js/theme/wolf-core-countdown.js"></script>
	<script src="/js/vendor/lazyloadxt.js"></script>
	<script src="/js/theme/wolf-core.js"></script>
	<script src="/js/vendor/js-cookie.js"></script>
	<script src="/js/vendor/fancybox.js"></script>
	<script src="/js/vendor/sticky-kit.js"></script>
	<script src="/js/theme/poize-theme.js"></script>
	<script src="/js/vendor/tooltipsy.js"></script>
	<script src="/js/vendor/jarallax.js"></script>
	<script src="/js/vendor/elementor-webpack-runtime.js"></script>
	<script src="/js/vendor/elementor-frontend-modules.js"></script>
	<script src="/js/vendor/jquery-ui-core.js"></script>
	<script src="/js/vendor/elementor-frontend.js"></script>
	<script src="/js/vendor/flickity.js"></script>
	<script src="/js/theme/wolf-core-carousels.js"></script>
	<script src="/js/vendor/imagesloaded.js"></script>
	<script src="/js/vendor/isotope.js"></script>
	<script src="/js/vendor/packery-mode.js"></script>
	<script src="/js/vendor/flex-images.js"></script>
	<script src="/js/theme/wolf-core-galleries.js"></script>
	<script src="/js/vendor/react.js"></script>
	<script src="/js/vendor/react-dom.js"></script>
	<script src="/js/vendor/wp-escape-html.js"></script>
	<script src="/js/vendor/wp-element.js"></script>
	<script src="/js/theme/poize-app.js"></script>
	<script src="/js/theme/wolf-core-youtube-video-bg.js"></script>
	<script src="/js/vendor/aos.js"></script>
	<script src="/js/theme/dialog.min.js"></script>
	<script src="/js/theme/share-link.min.js"></script>
	<script src="/js/theme/elementor-lazyload.js"></script>
	<script src="{{masonry_href}}"></script>
	<script src="{{js_href}}"></script>
</body>

</html>
