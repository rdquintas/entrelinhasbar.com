<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport" />
<title>{{seo_title}}</title>
{{#if seo_description}}<meta name="description" content="{{seo_description}}" />{{/if}}
{{#if noindex}}<meta name="robots" content="noindex" />{{/if}}
{{#if canonical}}<link rel="canonical" href="{{canonical}}" />{{/if}}
{{#each alternates}}<link rel="alternate" hreflang="{{codigo}}" href="{{abs_href}}" />
{{/each}}{{#if x_default}}<link rel="alternate" hreflang="x-default" href="{{x_default}}" />{{/if}}
<!-- Pré-visualização ao partilhar o link (WhatsApp, Facebook, X, LinkedIn, ...) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{site_name}}" />
<meta property="og:title" content="{{seo_title}}" />
{{#if seo_description}}<meta property="og:description" content="{{seo_description}}" />{{/if}}
{{#if canonical}}<meta property="og:url" content="{{canonical}}" />{{/if}}
{{#if og_image}}<meta property="og:image" content="{{og_image}}" />
<meta property="og:image:secure_url" content="{{og_image}}" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="{{seo_title}}" />{{/if}}
<meta property="og:locale" content="{{locale_og}}" />
<meta name="twitter:card" content="{{#if og_image}}summary_large_image{{else}}summary{{/if}}" />
<meta name="twitter:title" content="{{seo_title}}" />
{{#if seo_description}}<meta name="twitter:description" content="{{seo_description}}" />{{/if}}
{{#if og_image}}<meta name="twitter:image" content="{{og_image}}" />{{/if}}
