# Conteúdo partilhado por todas as páginas.
# Para adicionar um idioma: acrescentar em "idiomas" e preencher a nova chave em TODOS os textos.
nome:
  pt: "Entrelinhas Bistro Bar"
  en: "Entrelinhas Bistro Bar"

# Endereço público do site, sem barra final (usado em canonical, sitemap e og:image).
url_base: "https://entrelinhasbar.netlify.app"

# Texto que aparece ao partilhar o link (WhatsApp, Facebook...) nas páginas sem descrição própria.
# As páginas dos eventos usam o resumo do evento e a sua imagem horizontal.
descricao:
  pt: "Bistrô bar no coração de Alverca: cervejas artesanais, petiscos caseiros e música ao vivo. Consulta a agenda de eventos."
  en: "Bistro bar in the heart of Alverca: craft beer, homemade tapas and live music. Check out our events."

idiomas:
  - codigo: pt
    nome: "Português"
    locale: "pt-PT"
  - codigo: en
    nome: "English"
    locale: "en-GB"
idioma_padrao: pt

# Imagem usada ao partilhar o site nas redes (opcional; por defeito usa o hero da página inicial).
og_imagem:
  ficheiro: ""

redes:
  facebook: "https://www.facebook.com/EntreLinhasbistro2019"
  instagram: "https://www.instagram.com/entrelinhas2019"
  youtube: ""
  newsletter: ""

# Etiquetas dos tipos de evento.
ui:
  tipos:
    concerto: { pt: "Concerto", en: "Concert" }
    workshop: { pt: "Workshop", en: "Workshop" }
    outro: { pt: "Outro", en: "Other" }
