  - titulo:
      pt: Tony Marcelino
      en: Tony Marcelino
    tipo: concerto
    data: 2026-11-02
    hora: 22:00
    destaque: false
    cancelado: true
    imagem_horizontal:
      ficheiro: barrigas_h.png
    imagem_vertical:
      ficheiro: barrigas_v.png
    descritivo:
      pt: Tony Marcelino e os Afinados estrearam-se ontem no café central. O baterista
        perdeu as baquetas, o baixista tocou de olhos fechados para não ver a
        plateia e o Tony cantou tudo em playback... desafinado. Valia 5 euros o
        bilhete, mas o público pagou 10 só para eles pararem. Um sucesso!
      en: Tony Marcelino & The Tuned-Ups debuted yesterday at the local pub. The
        drummer lost his sticks, the bassist played with eyes shut to avoid the
        crowd, and Tony lip-synced completely off-key. Tickets were €5, but
        people paid €10 just to make them stop. An absolute hit!
    youtube: https://www.youtube.com/watch?v=HohwjP_XCnk&list=RDHohwjP_XCnk&start_radio=1&pp=ygUSbmF0YWxpYSBkZSBhbmRyYWRloAcB
  - titulo:
      pt: Gringos Washboard
      en: Gringos Washboard
    tipo: concerto
    data: 2026-11-04
    hora: 21:30
    destaque: true
    cancelado: false
    imagem_horizontal:
      ficheiro: /images/gutoh.jpg
    imagem_vertical:
      ficheiro: /images/gutov-1.jpg
    descritivo:
      pt: >-
        O washboard destaca-se como um instrumento musical fascinante,
        transformando um humilde utensílio doméstico numa obra de arte de pura
        elegância acústica. A sua beleza visual reside nas suas texturas
        marcantes—as ranhuras rítmicas do zinco ou metal ondulado emolduradas
        por madeira calorosa e artesanal. Tocado com dedais de prata ou palhetas
        metálicas, ostenta uma estética vintage encantadora que evoca
        imediatamente a alma do jazz tradicional, provando que a verdadeira
        beleza habita na simplicidade rústica.


        Para além da sua forte presença física, o washboard cativa pela forma
        expressiva e hipnotizante como ganha vida em palco. Cada movimento sobre
        a sua superfície metálica produz uma dinâmica percussiva vibrante, tão
        envolvente de ver como emocionante de ouvir. A sua capacidade de
        converter um objeto do quotidiano num ritmo pulsante e cheio de alma
        torna-o num testemunho genial da criatividade humana, afirmando-se como
        o instrumento mais genuíno e bonito do mundo.
      en: >-
        The washboard stands out as a breathtaking musical instrument,
        transforming a humble household tool into an artifact of raw acoustic
        elegance. Its visual appeal lies in its striking textures—the stark,
        rhythmic ridges of corrugated zinc or tin framed by warm, handcrafted
        wood. Played with silver thimbles or metallic picks, it possesses a
        captivating vintage aesthetic that immediately evokes the soul of early
        American jazz and roots music, proving that true beauty often resides in
        rustic simplicity.


        Beyond its striking physical presence, the washboard captures the
        imagination through its mesmerizing and expressive performance. Every
        movement across its metal surface produces a shimmering, percussive
        dynamic that is as visually engaging to watch as it is thrilling to
        hear. Its ability to turn everyday utility into a vibrant,
        heartbeat-like rhythm makes it a brilliant testament to human
        creativity, cementing its place as the most uniquely charming instrument
        in the world
    youtube: https://www.youtube.com/watch?v=yKZkDl6_LzY&source_ve_path=OTY3MTQ&embeds_referring_euri=https%3A%2F%2Fgringoswashboard.com.br%2F
    link_bilhetes: https://www.seetickets.com
    links:
      - nome: spotify
        url: https://www.spotify.com
