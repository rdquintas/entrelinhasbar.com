# Conteúdo partilhado por todas as páginas.
# Para adicionar um idioma: acrescentar em "idiomas" e preencher a nova chave em TODOS os textos.
nome:
  pt: "Nome do Site"
  en: "Site Name"

# Endereço público do site, sem barra final (usado em canonical, sitemap e og:image).
url_base: "https://exemplo.netlify.app"

idiomas:
  - codigo: pt
    nome: "Português"
    locale: "pt-PT"
  - codigo: en
    nome: "English"
    locale: "en-GB"
idioma_padrao: pt

menu:
  - pagina: index
    label: { pt: "Início", en: "Home" }
  - pagina: agenda
    label: { pt: "Agenda", en: "Events" }
  - pagina: mural
    label: { pt: "Mural", en: "Wall" }
  - pagina: contactos
    label: { pt: "Contactos", en: "Contact" }

logo:
  ficheiro: logo.svg
  alt:
    pt: "Logótipo"
    en: "Logo"

# Imagem usada ao partilhar o site nas redes (opcional; por defeito usa o hero da página inicial).
og_imagem:
  ficheiro: ""

redes:
  facebook: "https://www.facebook.com/"
  instagram: "https://www.instagram.com/"
  newsletter: "https://exemplo.com/newsletter"

