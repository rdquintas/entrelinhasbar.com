faq:
  - pergunta: { pt: "Qual o vosso horário?", en: "What are your opening hours?" }
    resposta:
      pt: "Estamos abertos de segunda a sexta, das 10h às 18h, e ao sábado, das 10h às 14h. Em noites de concerto ou evento o horário pode ser alargado. Consulta a agenda para saberes mais."
      en: "We're open Monday to Friday, 10am to 6pm, and on Saturdays from 10am to 2pm. On concert or event nights we may stay open later. Check the agenda for details."
  - pergunta: { pt: "Servem refeições?", en: "Do you serve food?" }
    resposta:
      pt: "Sim! A nossa cozinha prepara petiscos caseiros com receitas de família e produtos da época, ideais para partilhar à mesa com uma cerveja artesanal."
      en: "Yes! Our kitchen prepares homemade tapas from family recipes and seasonal produce, perfect for sharing over a craft beer."
  - pergunta: { pt: "Posso reservar mesa?", en: "Can I book a table?" }
    resposta:
      pt: "Podes, sim. Liga-nos ou envia-nos um email para entrelinhascafebistro@gmail.com com o dia, a hora e o número de pessoas. Em noites de concerto recomendamos reservar com antecedência."
      en: "Of course. Give us a call or send us an email to entrelinhascafebistro@gmail.com with the date, time and number of people. On concert nights we recommend booking in advance."
  - pergunta: { pt: "Posso levar crianças?", en: "Can I bring children?" }
    resposta:
      pt: "Claro! As crianças são bem-vindas, acompanhadas por um adulto. O Entrelinhas é um ponto de encontro para todas as gerações."
      en: "Of course! Children are welcome when accompanied by an adult. Entrelinhas is a meeting place for all generations."
  - pergunta: { pt: "Tenho uma banda e gostava de ir aí tocar. Como posso fazer?", en: "I have a band and would love to play at your place. How can I do that?" }
    resposta:
      pt: |-
        Adoramos conhecer novos músicos! Envia-nos um email para entrelinhascafebistro@gmail.com com o seguinte:
        - Texto com uma breve apresentação da banda e o estilo musical (em Português e Inglês)
        - 2 fotos: uma HORIZONTAL e outra VERTICAL        
        - Links, se tiveres, para ouvirmos o vosso trabalho (YouTube, Spotify, Instagram...)
        - Um link de um video no YouTube (só se tiveres, claro)
      en: |-
        We love discovering new musicians! Send us an email at entrelinhascafebistro@gmail.com with the following:
        - A short text introducing your band and your musical style (in Portuguese and English)
        - 2 photos: one HORIZONTAL and one VERTICAL        
        - Links, if you have them, so we can listen to your work (YouTube, Spotify, Instagram...)
        - A single YouTube video link (only if you have one, of course)
  - pergunta: { pt: "Posso reservar o espaço para organizar uma festa particular?", en: "Can I book the venue for a private party?" }
    resposta:
      pt: "Sim, recebemos aniversários, jantares de grupo e outras celebrações. Contacta-nos por telefone ou email com a data, o número de convidados e o que tens em mente, e preparamos uma proposta à tua medida."
      en: "Yes, we host birthdays, group dinners and other celebrations. Get in touch by phone or email with the date, number of guests and what you have in mind, and we'll put together a tailored proposal."
  - pergunta: { pt: "Que tipo de pratos servem?", en: "What kind of dishes do you serve?" }
    resposta:
      pt: "Servimos petiscos caseiros, feitos com receitas de família e produtos da época, pensados para partilhar à mesa. Como a oferta muda ao longo do ano, o melhor é perguntares-nos o que há no dia. Se tiveres alguma restrição alimentar, avisa-nos e vemos o que podemos preparar para ti."
      en: "We serve homemade tapas, made from family recipes and seasonal produce and meant for sharing. Since the menu changes throughout the year, it's best to ask us what's on that day. If you have any dietary requirements, let us know and we'll see what we can prepare for you."
