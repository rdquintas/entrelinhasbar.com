  - titulo:
      pt: The Invisible Tuba
      en: The Invisible Tuba
    tipo: concerto
    data: 2027-03-20
    hora: 18:00
    destaque: true
    cancelado: false
    imagem_horizontal:
      ficheiro: tuba_h.png
    imagem_vertical:
      ficheiro: tuba_v.png
    descritivo:
      pt: Nascidos no coração da cena musical de Lisboa por volta de 2017, os THE
        INVISIBLE TUBA têm conquistado o público de forma consistente,
        estabelecendo-se como uma referência vibrante no panorama musical de
        Lisboa. Unindo músicos de Portugal, Venezuela, EUA, Reino Unido e
        Itália, a banda tem atraído uma base diversificada de seguidores, desde
        aficionados do jazz tradicional a entusiastas da cultura vintage,
        através de uma musicalidade irrepreensível e de uma abordagem
        contagiante ao repertório do swing clássico.
      en: Formed around 2017 in the heart of Lisbon’s music scene, THE INVISIBLE TUBA
        has steadily grown in popularity, establishing themselves as a vibrant
        fixture in Lisbon’s music scene. Bringing together musicians from
        Portugal, Venezuela, the United Kingdom, USA, and Italy, they’ve
        attracted a wide variety of fans, from traditional jazz aficionados to
        vintage dance enthusiasts, with the strength of their musicianship and
        their infectious approach to the classic swing catalog.
    youtube: https://youtube.com/shorts/AcbqJxNbXdg?feature=shared
