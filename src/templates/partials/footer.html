<footer class="site-footer">
  <p class="site-footer__contactos"><a href="{{contactos_url}}">{{ui.contactos}}</a></p>
  <ul class="social" aria-label="{{ui.redes}}">
    {{#if site.redes.facebook}}<li><a href="{{site.redes.facebook}}" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-facebook"></use></svg></a></li>{{/if}}
    {{#if site.redes.instagram}}<li><a href="{{site.redes.instagram}}" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-instagram"></use></svg></a></li>{{/if}}
    {{#if site.redes.newsletter}}<li><a href="{{site.redes.newsletter}}" target="_blank" rel="noopener noreferrer" aria-label="Newsletter"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-mail"></use></svg></a></li>{{/if}}
  </ul>
  <p class="site-footer__copy">© {{year}} {{site_name}}</p>
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-facebook" viewBox="0 0 24 24"><path fill="currentColor" d="M13.5 21v-8h2.7l.5-3.2h-3.2V7.8c0-.9.4-1.7 1.8-1.7h1.5V3.3S15.5 3 14.3 3C11.8 3 10.2 4.5 10.2 7.2v2.6H7.5V13h2.7v8h3.3z"/></symbol>
    <symbol id="icon-instagram" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="7" r="1.2" fill="currentColor"/></symbol>
    <symbol id="icon-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 7l8.5 6 8.5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  </svg>
</footer>
