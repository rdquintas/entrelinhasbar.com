													id="index-80417">
													{{#each eventos}}
													<article
														class="event type-event status-publish has-post-thumbnail hentry entry clearfix entry-grid entry-columns-1 entry-event-module-layout-standard thumbnail-color-tone-dark metro-landscape entry-event entry-accordion entry-event-accordion"
														data-event-date="{{data}}" data-thumbnail-color-tone="dark"
														itemscope="" itemtype="https://schema.org/MusicEvent">
														<meta content="{{titulo}}" itemprop="name" />

														<meta content="{{descritivo_curto}}" itemprop="description" />
														<div class="entry-event-accordion-inner">
															<div class="entry-event-info">
																<div class="event-accordion-big-date">
																	{{data_curta}} </div>

																<div class="venue">
																	{{hora}} </div>
																<span class="entry-event-accordion--btn"></span>
															</div>
															<div class="entry-event-summary">
																<div class="entry-event-title-container">
																	<h3 class="entry-event-title entry-title"
																		itemprop="name">
																		<a class="entry-event-title-link internal-link"
																			href="{{url}}" itemprop="url">
																			{{titulo}}
																		</a>
																	</h3>
																</div>
																<div class="entry-event-description">
																	<div class="entry-event-categories">
																	</div>
																	<p class="entry-event-excerpt"
																		itemprop="description">
																		{{descritivo_curto}} </p>
																</div>
															</div>
															<div class="entry-event-img">

																	href="#"><span>Buy
																		Tickets</span></a>  -->

																	class="cursor-static event-accordion-img internal-link no-link-style"
																	href="{{url}}" itemprop="url">
																	<img class="resized-thumbnail" decoding="async"
																		height="378" loading="lazy" src="{{thumb_src}}"
																		width="495" /> </a>
															</div>
														</div>
													</article>
													{{/each}}
												</div>
											</div>

										</div>
									</div>
								</div>
