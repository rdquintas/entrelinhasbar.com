  - titulo: { pt: "Tony Marcelino", en: "Tony Marcelino" }
    descritivo:
      pt: "Tony Marcelino e os Afinados estrearam-se ontem no café central. O baterista perdeu as baquetas, o baixista tocou de olhos fechados para não ver a plateia e o Tony cantou tudo em playback... desafinado. Valia 5 euros o bilhete, mas o público pagou 10 só para eles pararem. Um sucesso!"
      en: "Tony Marcelino & The Tuned-Ups debuted yesterday at the local pub. The drummer lost his sticks, the bassist played with eyes shut to avoid the crowd, and Tony lip-synced completely off-key. Tickets were €5, but people paid €10 just to make them stop. An absolute hit!"
    tipo: concerto
    data: "2026-11-02"
