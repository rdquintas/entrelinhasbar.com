# Os eventos podem estar por qualquer ordem: o site ordena-os por data e hora.
# Os eventos com data anterior a hoje são removidos desta lista no build (e as suas imagens também).
# Apagar o evento desta lista remove-o e remove também as suas imagens do repositório.
# O endereço da página do evento (ex.: /event/tuba-ao-vivo/ ou /en/event/tuba-ao-vivo/) é gerado a partir do título.
eventos:
  - titulo: { pt: "The Invisible Tuba", en: "The Invisible Tuba" }
    descritivo:
      pt: "Nascidos no coração da cena musical de Lisboa por volta de 2017, os THE INVISIBLE TUBA têm conquistado o público de forma consistente, estabelecendo-se como uma referência vibrante no panorama musical de Lisboa. Unindo músicos de Portugal, Venezuela, EUA, Reino Unido e Itália, a banda tem atraído uma base diversificada de seguidores, desde aficionados do jazz tradicional a entusiastas da cultura vintage, através de uma musicalidade irrepreensível e de uma abordagem contagiante ao repertório do swing clássico."
      en: "Formed around 2017 in the heart of Lisbon’s music scene, THE INVISIBLE TUBA has steadily grown in popularity, establishing themselves as a vibrant fixture in Lisbon’s music scene. Bringing together musicians from Portugal, Venezuela, the United Kingdom, USA, and Italy, they’ve attracted a wide variety of fans, from traditional jazz aficionados to vintage dance enthusiasts, with the strength of their musicianship and their infectious approach to the classic swing catalog."
    tipo: concerto
    data: "2027-03-20"
    hora: "18:00"
    imagem_horizontal: { ficheiro: tuba_h.png }
    imagem_vertical: { ficheiro: tuba_v.png }
